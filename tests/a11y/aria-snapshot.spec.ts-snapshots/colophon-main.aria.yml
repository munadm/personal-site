- main:
  - heading "Colophon" [level=1]
  - paragraph: How this site is built.
  - separator
  - heading "Stack" [level=2]
  - paragraph:
    - text: Built with
    - link "Astro":
      - /url: https://astro.build
    - text: ", shipping essentially zero client-side JavaScript. The exceptions are the light/dark theme toggle and a few lines that mark the paragraph being read aloud on narrated pages. Type is set in a self-hosted Archivo variable font, served from this site rather than a third-party font host. Hosted on Cloudflare Pages."
  - heading "Design system" [level=2]
  - paragraph: "The visual language is op-art-inspired and accessibility-first: static line-weight geometry, ruled dividers, and typography carry the expression, rather than imagery, motion, or decoration for its own sake. Every color pairing used for text is contrast-checked, with body text held to AAA (7:1) rather than the AA minimum."
  - heading "How it was made" [level=2]
  - paragraph:
    - text: This site was designed and built through an agent workforce that I directed — Claude models handling the design system, the page-by-page build, and accessibility verification, with me setting direction, reviewing output, and making the calls a person needs to make. It's also the subject of a forthcoming essay on the
    - link "writing":
      - /url: /writing
    - text: page.
  - heading "Audio narration" [level=2]
  - paragraph:
    - text: The case studies carry an AI-narrated reading, labelled plainly as such. The voice is synthesized at build time with
    - link "Gemini text-to-speech":
      - /url: https://ai.google.dev/gemini-api/docs/speech-generation
    - text: ", a paragraph at a time so the phrasing carries across whole sentences rather than resetting at every full stop. Each reading is generated from the page's own text, encoded to a small mp3, and served as a static file through a native audio player, so there is nothing to load unless you press play. The page you are reading is the transcript."
  - paragraph: "While a reading plays, a rule in the margin marks the paragraph being spoken, so you can follow the voice through the text. Its timing comes from the audio itself: the pauses between paragraphs are measured when the reading is made. The marker is visual only. It never scrolls the page and never changes what a screen reader announces. The player has a switch to turn it off, and a choice between the margin rule and a soft outline around the paragraph; the page remembers both."
  - heading "Privacy" [level=2]
  - paragraph: No analytics, no cookies, no tracking scripts of any kind. I don't know who visits this site or what they look at.